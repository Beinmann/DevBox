# Optional Tailscale sidecar. bash_in_dev_container.sh / stop_dev_container.sh
# add this file with `-f` (never edit docker-compose.yml for it); when
# Tailscale is not set up on the host, the sidecar is not started. Like the
# base file it must not be used with `docker compose` directly.
#
# The box shares the sidecar's network namespace, so loopback-only servers in
# the box are the sidecar's localhost too, and the node shows up on the
# tailnet as TS_HOSTNAME. Userspace networking: no /dev/net/tun, so the box has
# no tailnet interface. That alone is not isolation: the netns sits on a Docker
# bridge, and a packet to a 100.x address would leave via the host's own
# tailscale0 with the *host* as its source, bypassing the tailnet policy (seen
# in testing). So the sidecar (and only it, not the box) gets NET_ADMIN to
# reject any kernel-stack traffic to the tailnet ranges before starting. Compose recreates the box if
# its config changed (e.g. Tailscale toggled); if only the sidecar is
# recreated the box keeps a dead netns, so restart both with
# ./stop_dev_container.sh.
x-require-wrapper: "${DEV_BOX_WRAPPER:?Use ./bash_in_dev_container.sh instead of calling docker compose directly}"

services:
  tailscale:
    # Pinned (>= 2 weeks old at pinning time) and the only place the image is
    # named: the wrapper pulls it by service name when missing, since `up`
    # runs with --pull never. To bump: edit this tag, then stop and start.
    image: tailscale/tailscale:v1.102.5
    restart: "no"
    cap_add:
      - NET_ADMIN
    # Fail closed (-e): if the rule can't be installed the sidecar, and so the
    # box that depends on it, does not start. Inbound tailnet connections are
    # delivered by tailscaled's userspace stack and are not affected. The
    # IPv6 rule is best effort (the bridge has no IPv6 by default). No $ in
    # here: Compose would interpolate it.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        iptables -I OUTPUT -d 100.64.0.0/10 -j REJECT
        ip6tables -I OUTPUT -d fd7a:115c:a1e0::/48 -j REJECT || true
        exec /usr/local/bin/containerboot
    # Host-side file with TS_AUTHKEY=<OAuth client secret>?ephemeral=true&preauthorized=true
    # (outside the repo and ./home). Read by Compose as root and handed only
    # to this container; the box can't see it. `stop_dev_container.sh` runs
    # without it, hence the /dev/null fallback.
    env_file: ${TS_ENV_FILE:-/dev/null}
    environment:
      - TS_HOSTNAME=${TS_HOSTNAME:-devbox}
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:devbox
    volumes:
      # Node key and cached certs. A bind mount, not a named volume, so
      # `compose down` leaves Docker clean. Mounted here only, never in the box.
      - ./tailscale-state:/var/lib/tailscale

  my-dev-container:
    network_mode: service:tailscale
    # Can't be combined with network_mode; reset the base file's list.
    networks: !reset null
    depends_on:
      - tailscale
