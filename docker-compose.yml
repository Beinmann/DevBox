# Bring the dev box up on demand via ./bash_in_dev_container.sh — do not call
# `docker compose` directly. The container persists across exits (`up -d` +
# `exec`) until explicitly torn down via ./stop_dev_container.sh. All
# persistent state lives in the bind mounts below (./home and ./Everything),
# not in the container itself.
#
# The x-require-wrapper line below is not a real service option — it's a
# guard: Compose does env var substitution on every string in this file
# (including custom x- fields) before doing anything else, so an unset
# DEV_BOX_WRAPPER makes any direct `docker compose ...` invocation fail
# immediately with the message below. Only the wrapper script sets that var.
x-require-wrapper: "${DEV_BOX_WRAPPER:?Use ./bash_in_dev_container.sh instead of calling docker compose directly}"

services:
  my-dev-container:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-dev-box-v2
    # Compose's default pull_policy ("missing") still tries a registry pull
    # first even when a `build` section is present, only falling back to
    # building on failure. "never" skips that pull attempt entirely and
    # goes straight to build (only if the image is missing) or reusing the
    # cached local image.
    pull_policy: never
    # Container runs as the unprivileged `dev` user (see Dockerfile), not root.
    user: dev
    working_dir: /home/dev/Main/Everything
    # Give an interactive shell / tmux a proper TTY.
    stdin_open: true
    tty: true
    # Larger shared memory + no PID limits help heavier dev workloads.
    init: true
    # Never auto-restart — the container persists across `up -d` calls but
    # only comes back up when the wrapper script explicitly brings it up.
    restart: "no"
    # Long-running idle process so `up -d` has something to keep alive.
    # Interactive shells attach separately via `docker compose exec`, which
    # doesn't depend on this process.
    command: sleep infinity
    volumes:
      # Persist the whole user home (dotfiles, shell history, ~/.claude, caches).
      - ./home:/home/dev
      # Project workspace, mounted where WORKDIR expects it.
      - ./Everything:/home/dev/Main/Everything
    environment:
      - TERM=xterm-256color
